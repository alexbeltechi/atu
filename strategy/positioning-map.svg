<title id="title">ATU potential positioning: personal depth and business strategy</title>
<desc id="desc">Conceptual map. Vertical axis: shallow external presentation to deeper personal direction. Horizontal axis: visual execution to commercial strategy. Brand studios toward lower left, identity practice toward upper left, coaching toward mid right, and proposed ATU toward upper right. These are archetypes rather than competitive scores.</desc>
